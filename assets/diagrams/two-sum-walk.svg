<text x="505" y="125" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">target = 9</text>
<text x="505" y="140" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">2 + 7</text>
<path d="M332 150 L415 132" fill="none" stroke="#0d7a6f" stroke-width="1.6" marker-end="url(#arr-acc-two-sum-walk)"/>
