<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="Best time to buy/sell stock">
  <defs>
    <marker id="arr-best-time-to-buy-sell-stock" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c3a45"/>
    </marker>
    <marker id="arr-acc-best-time-to-buy-sell-stock" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0d7a6f"/>
    </marker>
    <filter id="sh-best-time-to-buy-sell-stock" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#15202b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="900" height="450" fill="#fbfcfd"/>
  <rect x="0" y="0" width="900" height="44" fill="#15202b"/>
  <text x="28" y="28" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Best time to buy/sell stock</text>
  <path d="M96 230 L176 150 L256 210 L336 110 L416 170 L496 90" fill="none" stroke="#0d7a6f" stroke-width="1.55"/>
<circle cx="176" cy="150" r="24" fill="#d5ebe7" stroke="#2c3a45" stroke-width="1.5" filter="url(#sh-best-time-to-buy-sell-stock)"/><text x="176" y="155" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#15202b">buy</text>
<circle cx="496" cy="90" r="24" fill="#0d7a6f" stroke="#0d7a6f" stroke-width="1.5" filter="url(#sh-best-time-to-buy-sell-stock)"/><text x="496" y="95" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">sell</text>
<path d="M176 150 H496" fill="none" stroke="#0d7a6f" stroke-width="1.55" marker-end="url(#arr-acc-best-time-to-buy-sell-stock)"/>
<rect x="298" y="126" width="76" height="20" rx="10" fill="#ffffff" stroke="#9aabb5" stroke-width="1"/><text x="336" y="140" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="500" fill="#5b6b76">max profit</text>
<rect x="580" y="118" width="230" height="82" rx="6" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2"/><text x="592" y="136" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">SCAN STATE</text><text x="592" y="156" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#15202b">Track min price so far; profit today = price - min.</text>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-best-time-to-buy-sell-stock)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">min_price so far</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">sell after buy only</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">O(n), one pass</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: greedily remember the best prior buy, then evaluate each sell.</text>
</svg>
