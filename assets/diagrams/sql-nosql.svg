<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="SQL vs NoSQL">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="760" height="280" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">SQL vs NoSQL</text>
  
  <rect x="60" y="90" width="260" height="140" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="190.0" y="154.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">SQL</text>
<text x="190.0" y="174.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">fixed schema · joins · ACID</text>
  <rect x="400" y="90" width="260" height="140" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="530.0" y="154.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">NoSQL</text>
<text x="530.0" y="174.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">flexible · scale-out · simple access</text>
  <text x="60" y="260" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Pick for access patterns first — not fashion.</text>

</svg>
