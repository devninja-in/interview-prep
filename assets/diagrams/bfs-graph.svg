<circle cx="390" cy="90" r="24" fill="#ffffff" stroke="#2c3a45" stroke-width="1.5" filter="url(#sh-graph-bfs-layers)"/><text x="390" y="95" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#15202b">D</text>
<circle cx="390" cy="172" r="24" fill="#ffffff" stroke="#2c3a45" stroke-width="1.5" filter="url(#sh-graph-bfs-layers)"/><text x="390" y="177" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="700" fill="#15202b">E</text>
