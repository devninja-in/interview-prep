<path d="M114 162 L216 122 M114 182 L216 222 M264 112 L366 90 M264 232 L366 254 M264 122 L366 164" fill="none" stroke="#2c3a45" stroke-width="1.55"/>
<rect x="560" y="96" width="210" height="52" rx="6" fill="#f3e2c7" stroke="#2c3a45" stroke-width="1.6" filter="url(#sh-graph-bfs-layers)"/>

<text x="665" y="115" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">queue</text>
<text x="665" y="130" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">A | B C | D E F</text>
<rect x="560" y="178" width="250" height="70" rx="6" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2"/><text x="572" y="196" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">SHORTEST PATH</text><text x="572" y="216" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#15202b">First visit to a node is the minimum edge count in an unweighted graph.</text>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-graph-bfs-layers)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">queue + visited set</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">first visit is shortest depth</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">O(V+E)</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: BFS is level-order traversal with a visited set.</text>
