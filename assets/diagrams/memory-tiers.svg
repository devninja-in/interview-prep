<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Assistant memory tiers">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="300" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Assistant memory tiers</text>
  
  <rect x="40" y="110" width="160" height="70" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="120.0" y="139.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Short-term</text>
<text x="120.0" y="159.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">thread window</text>
  <rect x="240" y="110" width="160" height="70" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="320.0" y="139.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Working state</text>
<text x="320.0" y="159.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">slots / summary</text>
  <rect x="440" y="110" width="160" height="70" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="520.0" y="139.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Long-term facts</text>
<text x="520.0" y="159.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">editable store</text>
  <rect x="640" y="110" width="140" height="70" rx="10" fill="#fff" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="710.0" y="139.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Semantic recall</text>
<text x="710.0" y="159.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">embeddings</text>
  <path d="M205 145 H235" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M405 145 H435" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M605 145 H635" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <text x="40" y="230" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Do not dump months of chat into the prompt — retrieve the right memories each turn.</text>
  <text x="40" y="255" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">User must be able to see, edit, and delete long-term memory.</text>

</svg>
