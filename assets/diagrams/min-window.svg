<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="Minimum window substring">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="260" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Minimum window substring</text>
  
  <text x="40" y="70" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#0d7a6f">s="ADOBECODEBANC" t="ABC"</text>
  <rect x="40" y="100" width="200" height="50" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="140.0" y="125.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">window covers A,B,C</text>
  <rect x="280" y="100" width="200" height="50" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="380.0" y="125.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">shrink left while valid</text>
  <rect x="520" y="100" width="200" height="50" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="620.0" y="125.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">best = "BANC"</text>
  <path d="M245 125 H275" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M485 125 H515" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <text x="40" y="210" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Expand until need met; shrink for minimal covering window.</text>

</svg>
