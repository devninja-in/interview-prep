<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="CAP trade-offs">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">CAP trade-offs</text>
  
  <polygon points="340,70 160,240 520,240" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.4"/>
  <text x="340" y="95" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f1c24">C</text>
  <text x="175" y="255" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f1c24">A</text>
  <text x="505" y="255" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f1c24">P</text>
  <text x="250" y="170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">CP</text>
  <text x="400" y="170" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">AP</text>
  <text x="80" y="285" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">During a partition you choose consistency or availability.</text>

