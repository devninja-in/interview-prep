<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="Stack">
  <defs>
    <marker id="arr-stack" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c3a45"/>
    </marker>
    <marker id="arr-acc-stack" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0d7a6f"/>
    </marker>
    <filter id="sh-stack" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#15202b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="900" height="450" fill="#fbfcfd"/>
  <rect x="0" y="0" width="900" height="44" fill="#15202b"/>
  <text x="28" y="28" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Stack</text>
  <rect x="120" y="204" width="130" height="42" rx="4" fill="#d5ebe7" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-stack)"/><text x="185" y="229" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#15202b">A</text>
<rect x="120" y="156" width="130" height="42" rx="4" fill="#d5ebe7" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-stack)"/><text x="185" y="181" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#15202b">B</text>
<rect x="120" y="108" width="130" height="42" rx="4" fill="#0d7a6f" stroke="#0d7a6f" stroke-width="1.8" filter="url(#sh-stack)"/><text x="185" y="133" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#ffffff">C</text>
<text x="270" y="132" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0d7a6f">top</text>
<path d="M260 128 L250 128" fill="none" stroke="#0d7a6f" stroke-width="1.6" marker-end="url(#arr-acc-stack)"/>
<rect x="455" y="96" width="160" height="52" rx="6" fill="#cfe8e2" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-stack)"/>

<text x="535" y="115" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">push(x)</text>
<text x="535" y="130" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">add above top</text>
<rect x="455" y="176" width="160" height="52" rx="6" fill="#cfe8e2" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-stack)"/>

<text x="535" y="195" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">pop()</text>
<text x="535" y="210" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">remove top</text>
<rect x="76" y="274" width="430" height="48" rx="6" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2"/><text x="88" y="292" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">PATTERN</text><text x="88" y="312" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#15202b">Use stacks for matching, rollback, monotonic next-greater scans.</text>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-stack)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">top pointer on C</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">only top is mutable</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">push/pop O(1)</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: LIFO gives O(1) local state for nested or monotonic problems.</text>
</svg>
