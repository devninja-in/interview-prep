<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Stack">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Stack</text>
  
  <rect x="80" y="180" width="120" height="40" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="140.0" y="200.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">A</text>
  <rect x="80" y="130" width="120" height="40" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="140.0" y="150.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">B</text>
  <rect x="80" y="80" width="120" height="40" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="140.0" y="94.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">C</text>
<text x="140.0" y="114.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">top</text>
  <text x="260" y="120" font-family="Manrope, Segoe UI, sans-serif" font-size="14" fill="#0f1c24">push → add on top</text>
  <text x="260" y="150" font-family="Manrope, Segoe UI, sans-serif" font-size="14" fill="#0f1c24">pop → remove from top</text>
  <text x="80" y="240" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Last in, first out — perfect for matching and next-greater problems.</text>

</svg>
