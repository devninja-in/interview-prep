<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="Kafka-like queue">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="260" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Kafka-like queue</text>
  
  <rect x="40" y="110" width="120" height="50" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="100.0" y="135.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Producers</text>
  <rect x="200" y="70" width="140" height="40" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="270.0" y="90.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Partition 0</text>
  <rect x="200" y="120" width="140" height="40" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="270.0" y="140.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Partition 1</text>
  <rect x="200" y="170" width="140" height="40" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="270.0" y="190.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Partition 2</text>
  <rect x="400" y="110" width="160" height="50" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="480.0" y="135.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Consumer group</text>
  <rect x="600" y="110" width="140" height="50" rx="10" fill="#fff" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="670.0" y="135.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Offsets</text>
  <path d="M165 135 H195" stroke="#0f1c24" stroke-width="1.2"/>
  <path d="M345 135 H395" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M565 135 H595" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <text x="40" y="240" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Order per partition key; one consumer per partition in a group.</text>

</svg>
