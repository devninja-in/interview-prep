  <path d="M630 212 H645" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <rect x="280" y="260" width="110" height="40" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
