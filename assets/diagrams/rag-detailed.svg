<text x="455.0" y="274.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Abstain</text>
<text x="455.0" y="294.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">low conf.</text>
  <path d="M335 234 V255" stroke="#0f1c24" stroke-width="1.2"/>
  <path d="M455 234 V255" stroke="#0f1c24" stroke-width="1.2"/>
  <text x="40" y="335" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Separate ingest from query. Filter permissions in retrieval — never only in the prompt.</text>

