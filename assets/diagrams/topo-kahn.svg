<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="Course Schedule (Kahn)">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="280" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Course Schedule (Kahn)</text>
  
  <rect x="40" y="100" width="70" height="50" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="75.0" y="119.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">0</text>
<text x="75.0" y="139.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">in=0</text>
  <rect x="160" y="100" width="70" height="50" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="195.0" y="119.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">1</text>
<text x="195.0" y="139.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">in=1</text>
  <rect x="280" y="100" width="70" height="50" rx="10" fill="#fff" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="315.0" y="119.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">2</text>
<text x="315.0" y="139.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">in=1</text>
  <rect x="400" y="100" width="70" height="50" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="435.0" y="119.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">3</text>
<text x="435.0" y="139.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">in=2</text>
  <path d="M115 125 H155" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M235 125 H275" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M350 125 H395" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M75 155 V190 H435 V155" fill="none" stroke="#3a4a54" stroke-width="1.2"/>
  <text x="40" y="230" font-family="Manrope, Segoe UI, sans-serif" font-size="13" fill="#0f1c24">Kahn: queue all indegree 0 → take course → decrement neighbors</text>
  <text x="40" y="260" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">If you cannot process all nodes, there is a cycle → cannot finish.</text>

</svg>
