<rect x="222" y="92" width="92" height="42" rx="6" fill="#cfe8e2" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-word-ladder-bfs)"/>

<text x="268" y="113" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">hot</text>
<rect x="374" y="72" width="92" height="42" rx="6" fill="#cfe8e2" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-word-ladder-bfs)"/>

