<text x="724" y="113" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">cog</text>
<path d="M162 149 H222 V113" fill="none" stroke="#0d7a6f" stroke-width="1.5" marker-end="url(#arr-acc-word-ladder-bfs)"/>
<path d="M314 113 H374 V93" fill="none" stroke="#0d7a6f" stroke-width="1.5" marker-end="url(#arr-acc-word-ladder-bfs)"/>
<path d="M466 93 H526 V113" fill="none" stroke="#0d7a6f" stroke-width="1.5" marker-end="url(#arr-acc-word-ladder-bfs)"/>
<path d="M618 113 H678 V113" fill="none" stroke="#0d7a6f" stroke-width="1.5" marker-end="url(#arr-acc-word-ladder-bfs)"/>
<rect x="210" y="236" width="360" height="58" rx="6" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2"/><text x="222" y="254" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">NEIGHBOR GENERATION</text><text x="222" y="274" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#15202b">Wildcard buckets like h*t avoid comparing every word pair.</text>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-word-ladder-bfs)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">frontier by word distance</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">first target hit is shortest</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">O(N * word_len^2)</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: BFS gives shortest transformations; preprocessing makes neighbors cheap.</text>
</svg>
