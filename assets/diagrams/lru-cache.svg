<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="LRU cache">
  <defs>
    <marker id="arr-lru-cache" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c3a45"/>
    </marker>
    <marker id="arr-acc-lru-cache" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0d7a6f"/>
    </marker>
    <filter id="sh-lru-cache" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#15202b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="900" height="450" fill="#fbfcfd"/>
  <rect x="0" y="0" width="900" height="44" fill="#15202b"/>
  <text x="28" y="28" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">LRU cache</text>
  <rect x="70" y="120" width="140" height="54" rx="6" fill="#dde9f7" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-lru-cache)"/>

<text x="140" y="140" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">hash map</text>
<text x="140" y="155" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">key -&gt; list node</text>
<rect x="330" y="90" width="90" height="44" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.6" filter="url(#sh-lru-cache)"/>

<text x="375" y="105" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">MRU</text>
<text x="375" y="120" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">C</text>
<rect x="460" y="90" width="90" height="44" rx="6" fill="#cfe8e2" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-lru-cache)"/>

<text x="505" y="112" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">B</text>
<rect x="590" y="90" width="90" height="44" rx="6" fill="#f7e7c8" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-lru-cache)"/>

<text x="635" y="105" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">LRU</text>
<text x="635" y="120" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">A</text>
<path d="M420 112 L455 112" fill="none" stroke="#2c3a45" stroke-width="1.6" marker-end="url(#arr-lru-cache)"/>
<path d="M550 112 L585 112" fill="none" stroke="#2c3a45" stroke-width="1.6" marker-end="url(#arr-lru-cache)"/>
<path d="M210 147 H330 V112" fill="none" stroke="#0d7a6f" stroke-width="1.5" marker-end="url(#arr-acc-lru-cache)"/>
<rect x="330" y="186" width="300" height="74" rx="6" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2"/><text x="342" y="204" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text><text x="342" y="224" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#15202b">Reads and writes move a node to MRU; capacity eviction pops LRU.</text>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-lru-cache)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">map + doubly linked list</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">MRU left, LRU right</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">get/put O(1)</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: hash map + doubly linked list gives O(1) get/put.</text>
</svg>
