<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="LRU Cache structure">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="300" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">LRU Cache structure</text>
  
  <rect x="40" y="100" width="160" height="70" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="120.0" y="129.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">HashMap</text>
<text x="120.0" y="149.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">key → node</text>
  <rect x="280" y="80" width="480" height="120" rx="10" fill="#fff" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="520.0" y="140.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24"></text>
  <text x="300" y="110" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Doubly linked list (MRU → LRU)</text>
  <rect x="300" y="130" width="90" height="44" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="345.0" y="152.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">MRU</text>
  <rect x="420" y="130" width="90" height="44" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="465.0" y="152.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">…</text>
  <rect x="540" y="130" width="90" height="44" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="585.0" y="152.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">LRU</text>
  <path d="M395 152 H415" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M515 152 H535" stroke="#0f1c24" stroke-width="1.3" marker-end="url(#arrowhead)"/>
  <path d="M210 135 H270" stroke="#0f1c24" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <text x="40" y="250" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">get/put: O(1) via map. Evict: remove LRU tail. On access: move node to MRU head.</text>

</svg>
