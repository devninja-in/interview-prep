<line x1="80" y1="252" x2="440" y2="252" stroke="#9aabb5" stroke-width="1"/><rect x="80" y="226" width="240" height="34" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.4" filter="url(#sh-merge-intervals-walk)"/><text x="200" y="248" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="650" fill="#15202b">[1,6]</text>
<rect x="560" y="116" width="190" height="56" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.6" filter="url(#sh-merge-intervals-walk)"/>

<text x="655" y="137" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">overlap</text>
<text x="655" y="152" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">3 &lt;= current.end</text>
<path d="M260 196 L260 220" fill="none" stroke="#0d7a6f" stroke-width="1.6" marker-end="url(#arr-acc-merge-intervals-walk)"/>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-merge-intervals-walk)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">current=[1,4], next=[3,6]</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">merged output never overlaps</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">O(n log n)</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: keep one current interval and extend its end greedily.</text>
