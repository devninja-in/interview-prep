      <path d="M0,0 L10,4 L0,8 Z" fill="#2c3a45"/>
    </marker>
    <marker id="arr-acc-merge-intervals-walk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0d7a6f"/>
    </marker>
    <filter id="sh-merge-intervals-walk" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#15202b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="900" height="450" fill="#fbfcfd"/>
  <rect x="0" y="0" width="900" height="44" fill="#15202b"/>
  <text x="28" y="28" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Merge intervals walk</text>
