<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Distributed cache ring">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="300" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Distributed cache ring</text>
  
  <circle cx="280" cy="150" r="90" fill="none" stroke="#c5d5ce" stroke-width="2"/>
  <rect x="250" y="40" width="70" height="36" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="285.0" y="58.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">N1</text>
  <rect x="380" y="120" width="70" height="36" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="415.0" y="138.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">N2</text>
  <rect x="250" y="220" width="70" height="36" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="285.0" y="238.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">N3</text>
  <rect x="140" y="120" width="70" height="36" rx="10" fill="#fff" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="175.0" y="138.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">N4</text>
  <rect x="500" y="90" width="160" height="48" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="580.0" y="114.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Client / proxy</text>
  <rect x="500" y="170" width="160" height="48" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="580.0" y="194.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">key → vnode</text>
  <path d="M500 145 H370" stroke="#0f1c24" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="40" y="280" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Consistent hashing: add/remove nodes moves ~1/N keys. Replicate hot keys; soft TTL vs stampede.</text>

</svg>
