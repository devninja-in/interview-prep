<text x="286" y="128" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#0d7a6f">water = min(leftMax,rightMax)-height[i]</text>
<rect x="540" y="132" width="250" height="82" rx="6" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2"/><text x="552" y="150" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">TWO POINTER RULE</text><text x="552" y="170" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#15202b">Advance the side with smaller max; the opposite side already bounds it.</text>
