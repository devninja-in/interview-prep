<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="Trapping Rain Water">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="280" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Trapping Rain Water</text>
  
  <text x="40" y="70" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#0d7a6f">height = [0,1,0,2,1,0,1,3,2,1,2,1]</text>
  <rect x="60" y="220" width="36" height="0" fill="#fff" stroke="#c5d5ce"/><rect x="105" y="192" width="36" height="28" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="150" y="220" width="36" height="0" fill="#fff" stroke="#c5d5ce"/><rect x="195" y="164" width="36" height="56" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="240" y="192" width="36" height="28" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="285" y="220" width="36" height="0" fill="#fff" stroke="#c5d5ce"/><rect x="330" y="192" width="36" height="28" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="375" y="136" width="36" height="84" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="420" y="164" width="36" height="56" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="465" y="192" width="36" height="28" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="510" y="164" width="36" height="56" fill="#d7ebe7" stroke="#c5d5ce"/><rect x="555" y="192" width="36" height="28" fill="#d7ebe7" stroke="#c5d5ce"/>
  <rect x="150" y="192" width="36" height="28" fill="#f7ddd4" opacity="0.85"/>
  <rect x="240" y="164" width="36" height="28" fill="#f7ddd4" opacity="0.85"/>
  <rect x="285" y="192" width="36" height="28" fill="#f7ddd4" opacity="0.85"/>
  <text x="40" y="255" font-family="Manrope, Segoe UI, sans-serif" font-size="13" fill="#0f1c24">Water at i = min(left_max, right_max) - height[i]</text>
  <text x="480" y="255" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Two pointers: advance the side with smaller max.</text>

</svg>
