<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Bit manipulation">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="720" height="240" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Bit manipulation</text>
  
  <text x="60" y="110" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#0f1c24">5 = 1 0 1</text>
  <text x="60" y="145" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#0f1c24">3 = 0 1 1</text>
  <line x1="60" y1="160" x2="200" y2="160" stroke="#c5d5ce"/>
  <text x="60" y="190" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#0d7a6f">XOR 1 1 0 = 6</text>
  <text x="280" y="145" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">XOR cancels pairs — lonely numbers fall out for free.</text>

</svg>
