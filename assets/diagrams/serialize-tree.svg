<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Serialize binary tree">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="820" height="300" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Serialize binary tree</text>
  
  <rect x="360" y="70" width="70" height="40" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="395.0" y="90.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">1</text>
  <rect x="250" y="140" width="70" height="40" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="285.0" y="160.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">2</text>
  <rect x="470" y="140" width="70" height="40" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="505.0" y="160.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">3</text>
  <rect x="420" y="210" width="70" height="40" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="455.0" y="230.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">4</text>
  <rect x="520" y="210" width="70" height="40" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="555.0" y="230.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">5</text>
  <path d="M360 110 L285 140" stroke="#0f1c24" stroke-width="1.2"/>
  <path d="M430 110 L505 140" stroke="#0f1c24" stroke-width="1.2"/>
  <path d="M490 185 L455 210" stroke="#0f1c24" stroke-width="1.2"/>
  <path d="M520 185 L555 210" stroke="#0f1c24" stroke-width="1.2"/>
  <text x="40" y="100" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#0d7a6f">BFS serialize</text>
  <text x="40" y="130" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#0f1c24">1,2,3,#,#,4,5,#,#,#,#</text>
  <text x="40" y="270" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Level-order with explicit null markers makes encode/decode invertible.</text>

