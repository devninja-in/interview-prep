<text x="715" y="119" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">current = max(x, current+x)</text>
<rect x="620" y="172" width="190" height="54" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.6" filter="url(#sh-kadane-maximum-subarray)"/>

<text x="715" y="199" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">best = max(best,current)</text>
