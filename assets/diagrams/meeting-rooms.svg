<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="Meeting rooms sweep">
  <defs>
    <marker id="arr-meeting-rooms-sweep" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2c3a45"/>
    </marker>
    <marker id="arr-acc-meeting-rooms-sweep" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0d7a6f"/>
    </marker>
    <filter id="sh-meeting-rooms-sweep" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#15202b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="900" height="450" fill="#fbfcfd"/>
  <rect x="0" y="0" width="900" height="44" fill="#15202b"/>
  <text x="28" y="28" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Meeting rooms sweep</text>
  <line x1="90" y1="114" x2="450" y2="114" stroke="#9aabb5" stroke-width="1"/><rect x="90" y="88" width="144" height="34" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.4" filter="url(#sh-meeting-rooms-sweep)"/><text x="162" y="110" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="650" fill="#15202b">A</text>
<line x1="90" y1="168" x2="450" y2="168" stroke="#9aabb5" stroke-width="1"/><rect x="138" y="142" width="192" height="34" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.4" filter="url(#sh-meeting-rooms-sweep)"/><text x="234" y="164" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="650" fill="#15202b">B</text>
<line x1="90" y1="222" x2="450" y2="222" stroke="#9aabb5" stroke-width="1"/><rect x="282" y="196" width="96" height="34" rx="6" fill="#ffffff" stroke="#2c3a45" stroke-width="1.4" filter="url(#sh-meeting-rooms-sweep)"/><text x="330" y="218" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="650" fill="#15202b">C</text>
<rect x="560" y="96" width="170" height="54" rx="6" fill="#f3e2c7" stroke="#2c3a45" stroke-width="1.6" filter="url(#sh-meeting-rooms-sweep)"/>

<text x="645" y="116" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">min-heap</text>
<text x="645" y="131" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">earliest end</text>
<rect x="560" y="176" width="170" height="54" rx="6" fill="#d5ebe7" stroke="#0d7a6f" stroke-width="1.6" filter="url(#sh-meeting-rooms-sweep)"/>

<text x="645" y="196" text-anchor="middle" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#15202b">rooms = heap size</text>
<text x="645" y="211" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#5b6b76">peak overlap</text>
<rect x="48" y="318" width="804" height="82" rx="8" fill="#ffffff" stroke="#9aabb5" stroke-width="1.2" filter="url(#sh-meeting-rooms-sweep)"/>
<text x="62" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">STATE</text>
<text x="62" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">min-heap of end times</text>
<line x1="316" y1="330" x2="316" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="330" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">INVARIANT</text>
<text x="330" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">heap holds active meetings</text>
<line x1="584" y1="330" x2="584" y2="388" stroke="#9aabb5" stroke-width="1"/>
<text x="598" y="343" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#0d7a6f">COMPLEXITY</text>
<text x="598" y="367" text-anchor="start" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="550" fill="#15202b">O(n log n)</text>
  <rect x="0" y="414" width="900" height="36" fill="#f0f3f5"/><text x="28" y="436" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5b6b76">Interview takeaway: reuse a room when the earliest ending meeting has finished.</text>
</svg>
