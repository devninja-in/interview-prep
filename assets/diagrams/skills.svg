<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-label="Skills loading">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f1c24"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#f7faf8"/>
  <text x="24" y="36" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0f1c24">Skills loading</text>
  
  <rect x="60" y="100" width="180" height="70" rx="10" fill="#f3e8d8" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="150.0" y="129.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Name + description</text>
<text x="150.0" y="149.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">always loaded</text>
  <rect x="300" y="100" width="200" height="70" rx="10" fill="#f7ddd4" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="400.0" y="129.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Full SKILL.md</text>
<text x="400.0" y="149.0" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#3a4a54">loaded when needed</text>
  <rect x="560" y="100" width="120" height="70" rx="10" fill="#d7ebe7" stroke="#c5d5ce" stroke-width="1.2"/>
<text x="620.0" y="135.0" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#0f1c24">Agent</text>
  <path d="M245 135 H295" stroke="#0f1c24" stroke-width="1.4"/>
  <path d="M505 135 H555" stroke="#0f1c24" stroke-width="1.4"/>
  <text x="60" y="220" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#3a4a54">Keep catalogs cheap; pull full instructions only for the active skill.</text>

